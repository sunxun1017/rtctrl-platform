# Generic starting fragment for a periodic PREEMPT_RT control appliance.
# Merge into the target BSP, run olddefconfig, then audit the resulting .config.
CONFIG_PREEMPT_RT=y
CONFIG_HIGH_RES_TIMERS=y
CONFIG_HZ_PERIODIC=y
# CONFIG_NO_HZ is not set
# CONFIG_NO_HZ_IDLE is not set
# CONFIG_NO_HZ_FULL is not set
CONFIG_HZ_1000=y
CONFIG_HZ=1000
CONFIG_SMP=y
CONFIG_CPUSETS=y
CONFIG_CPU_ISOLATION=y
# CONFIG_RT_GROUP_SCHED is not set
CONFIG_IKCONFIG=y
CONFIG_IKCONFIG_PROC=y
CONFIG_FTRACE=y
CONFIG_TRACING=y
# CONFIG_IRQSOFF_TRACER is not set
# CONFIG_PREEMPT_TRACER is not set
# CONFIG_LOCKUP_DETECTOR is not set
# CONFIG_PROVE_LOCKING is not set
# Keep diagnostics visible without making external, version-pinned modules
# fail solely because a compiler learns a new warning.
# CONFIG_WERROR is not set

# The Orange Pi BSP enables an out-of-tree Broadcom driver whose private
# headers/firmware are not part of the kernel repository.  A wired real-time
# control image must not depend on that incomplete optional vendor module.
# CONFIG_WIFI_BUILD_MODULE is not set
# CONFIG_BCMDHD is not set
# CONFIG_BCMDHD_PCIE is not set
