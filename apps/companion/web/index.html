<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>小伴 · 设备控制台</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
</head>
<body>
<header><a class="brand" href="/">小伴<span>RV1126B · COMPANION</span></a><div class="connection"><i id="connection-dot"></i><span id="connection">正在连接控制台</span></div></header>
<div id="mode-banner" class="mode-banner" role="status">正在获取设备运行模式…</div>
<main>
<section class="companion panel" aria-label="设备表情">
<div class="eyebrow">和你一起，听见与看见</div>
<div id="avatar" class="avatar" data-state="offline" data-emotion="neutral" role="img" aria-label="等待连接">
<svg viewBox="0 0 320 220" aria-hidden="true"><rect class="face-shell" x="20" y="20" width="280" height="180" rx="76"/><g class="eyes"><rect x="87" y="80" width="26" height="47" rx="13"/><rect x="207" y="80" width="26" height="47" rx="13"/></g><path class="mouth" d="M138 150 Q160 168 182 150"/><g class="cheeks"><ellipse cx="75" cy="137" rx="17" ry="6"/><ellipse cx="245" cy="137" rx="17" ry="6"/></g></svg>
<div class="voice-bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
</div>
<h1 id="state-label" aria-live="polite">等待连接</h1><p id="state-hint">设备麦克风默认关闭，按住按钮才开始录音。</p>
<div class="controls"><button id="connect" type="button">连接语音服务</button><button id="mute" class="mute" type="button" aria-pressed="true">麦克风已静音</button></div>
<button id="talk" class="talk" type="button" disabled>按住说话</button>
<div class="under-controls"><span id="input-hint">使用设备麦克风 · 空格 / 回车也可按住说话</span><button id="interrupt" type="button" class="text-button" disabled>停止回答</button></div>
</section>
<div class="details">
<section class="panel conversation" aria-labelledby="conversation-title"><div class="section-head"><h2 id="conversation-title">这次对话</h2><span id="emotion" class="tag">平静</span></div><div class="utterance"><span class="speaker">你说</span><p id="transcript">你的话会出现在这里</p></div><div class="utterance reply"><span class="speaker">小伴</span><p id="reply">准备好后，连接服务并开启麦克风。</p></div></section>
<section class="panel vision" aria-labelledby="vision-title"><div class="section-head"><h2 id="vision-title">视觉感知</h2><span id="face-state" class="tag">等待状态</span></div><p id="face-summary">等待人脸服务</p><ul id="faces" aria-label="识别结果"></ul><small>相似度是匹配分数，不代表准确率。</small></section>
<section class="panel resources"><div class="section-head"><h2>设备状态</h2><span id="updated">尚未同步</span></div><div id="metrics">等待设备数据</div><p id="capabilities"></p></section>
</div>
</main>
<div id="error" class="error" role="alert" hidden></div>
<footer id="privacy-note">音频在按住说话期间发送到已配置的后端。松开结束录音；静音将停止采集。</footer>
</body>
</html>
