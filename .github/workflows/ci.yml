name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        preset: [release, humanoid23, asan, tsan]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j2
      - name: Test
        env:
          ASAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --preset ${{ matrix.preset }} --output-on-failure
      - name: Protocol integration demo
        run: ./build/${{ matrix.preset }}/rtctrl_frame_demo

  kernel-module:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install configured kernel headers
        run: sudo apt-get update && sudo apt-get install -y linux-headers-generic
      - name: Build out-of-tree mailbox module
        run: |
          kernel_dir=$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort -V | tail -1)
          ./kernel/scripts/build-module.sh "$kernel_dir"
