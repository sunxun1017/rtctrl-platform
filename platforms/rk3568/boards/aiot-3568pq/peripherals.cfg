# AIoT-3568PQ candidate, based on the three-page Patch hardware diagram.
# Audited against Linux 5.10.160, 9f9e9d18574d0914c0d192a90c3babfe1fd63c95.
# Merge on rockchip_linux_defconfig. This is NOT a board defconfig or boot image.
# Device nodes, pins, supplies, clocks and firmware still require the original DT.

# RK809 is supported by the RK808 family; TCS4525 by fan53555.
# Enabling code does not supply board voltage/charging policy.
CONFIG_REGULATOR=y
CONFIG_MFD_RK808=y
CONFIG_REGULATOR_RK808=y
CONFIG_REGULATOR_FAN53555=y
CONFIG_RTC_CLASS=y
CONFIG_RTC_DRV_RK808=y
CONFIG_COMMON_CLK_RK808=y
CONFIG_POWER_SUPPLY=y
CONFIG_CHARGER_BQ25700=y
CONFIG_TYPEC=y
CONFIG_TYPEC_TCPM=y
CONFIG_TYPEC_FUSB302=y

# Four-lane DSI + PWM backlight; NV3051F init sequence/timings are still absent.
CONFIG_DRM_PANEL_SIMPLE=y
CONFIG_BACKLIGHT_CLASS_DEVICE=y
CONFIG_BACKLIGHT_PWM=y

# RK809 playback and a possible USB Audio Class path for BH6080.
# USB descriptors must confirm UAC and actual exposed microphone channels.
CONFIG_SND_SOC_ROCKCHIP_MULTICODECS=y
CONFIG_SND_SOC_RK817=y
CONFIG_SND_USB_AUDIO=y

# AP6256 candidate vendor driver; firmware/NVRAM and GPIO wiring come from BSP.
CONFIG_RFKILL=y
CONFIG_RFKILL_RK=y
CONFIG_CFG80211=y
CONFIG_WL_ROCKCHIP=y
CONFIG_BCMDHD=y
CONFIG_AP6XXX=y
CONFIG_BCMDHD_SDIO=y
CONFIG_BT=y
CONFIG_BT_HCIUART=y
CONFIG_SERIAL_DEV_BUS=y
CONFIG_SERIAL_DEV_CTRL_TTYPORT=y
CONFIG_BT_HCIUART_SERDEV=y
CONFIG_BT_HCIUART_BCM=y

# EEPROM driver code only; the 24c16 address span/write policy require DT.
CONFIG_EEPROM_AT24=y
CONFIG_INPUT=y
CONFIG_INPUT_EVDEV=y
CONFIG_KEYBOARD_GPIO=y
CONFIG_LEDS_CLASS=y
CONFIG_LEDS_GPIO=y

# Connector-compatible OV5695 is a CANDIDATE, not a confirmed fitted sensor.
CONFIG_VIDEO_OV5695=y

# No fabricated CAP1188 SPI or SH3001 symbol: neither matching driver exists
# in this audited tree. KEYBOARD_CAP11XX is I2C-only and cannot bind SPI3.
# No PREEMPT_RT policy is imposed: GD32 owns the motor PWM/feedback domain.
