# Offline firstboot candidate. Pair with bsp/*-firstboot.dts, not the old EVB DTB.
CONFIG_BLK_DEV_INITRD=y
CONFIG_RD_GZIP=y
CONFIG_TMPFS=y
CONFIG_PROC_FS=y
CONFIG_SYSFS=y
CONFIG_MMC_BLOCK=y
CONFIG_EFI_PARTITION=y
CONFIG_EXT4_FS=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED_VOLTAGE=y
CONFIG_MFD_RK808=y
CONFIG_PINCTRL_RK805=y
CONFIG_REGULATOR_RK808=y
CONFIG_REGULATOR_FAN53555=y
CONFIG_COMMON_CLK_RK808=y
CONFIG_ROCKCHIP_IODOMAIN=y
CONFIG_THERMAL=y
CONFIG_ROCKCHIP_THERMAL=y
CONFIG_ROCKCHIP_FIQ_DEBUGGER=y
CONFIG_FIQ_DEBUGGER=y
CONFIG_FIQ_DEBUGGER_CONSOLE=y
CONFIG_FIQ_DEBUGGER_CONSOLE_DEFAULT_ENABLE=y
CONFIG_USB_STORAGE=y
CONFIG_SND_USB_AUDIO=y
# Board codec routing and speaker enable are a later stage; USB UAC only here.
# CONFIG_SND_SOC_RK817 is not set
CONFIG_INPUT_EVDEV=y

# No inherited Android partition, board identity, or automatic root mount policy.
CONFIG_CMDLINE=""
# CONFIG_CMDLINE_FORCE is not set

# Voltage/frequency and suspend paths require their own board acceptance.
# CONFIG_CPU_FREQ is not set
# CONFIG_ARM_ROCKCHIP_DMC_DEVFREQ is not set
# This vendor dwcmshc driver guards runtime PM functions with CONFIG_PM_SLEEP.
# Retain build support; rockchip-suspend stays disabled in DT. Do not enter
# system suspend during firstboot (kernel option is NOT a safety interlock).
CONFIG_SUSPEND=y
# The pinned vendor tree has an undefined migrate_tasks() in its non-RT
# hotplug path. PM_SLEEP_SMP selects HOTPLUG_CPU; use the RT build path.
# This is a build compatibility choice, not a measured RT guarantee.
# CONFIG_PREEMPT_VOLUNTARY is not set
CONFIG_PREEMPT_RT=y
# CONFIG_HIBERNATION is not set

# Do not use firstboot to program charging/Type-C policy.
# CONFIG_CHARGER_BQ25700 is not set
# CONFIG_BATTERY_RK817 is not set
# CONFIG_CHARGER_RK817 is not set
# CONFIG_TYPEC_FUSB302 is not set

# DT disables RGA, but this driver's late_init runs without an enabled device.
# CONFIG_ROCKCHIP_MULTI_RGA is not set
# Keep SCMI clocks and Rockchip CRU resets; these unused SCMI clients probe
# protocols absent from the firstboot DT and are not needed for RAM userspace.
# CONFIG_ARM_SCMI_POWER_DOMAIN is not set
# CONFIG_RESET_SCMI is not set
