# Validated on ALIENTEK RV1126B / ES8389. Opt in with ALSA_CONFIG_PATH.
# Preserve system definitions; do not overwrite /etc/asound.conf.
</usr/share/alsa/alsa.conf>
pcm.rtctrl_es8389 {
    type plug
    slave {
        pcm "hw:0,0"
        rate 48000
        channels 2
        format S16_LE
    }
}

# ALIENTEK Main Mic is INPUT2 -> ADCR. Do not average the inactive left ADC.
# Separate capture PCM: keep speaker playback channel routing unchanged.
pcm.rtctrl_es8389_capture {
    type plug
    slave {
        pcm "hw:0,0"
        rate 48000
        channels 2
        format S16_LE
    }
    ttable.0.1 1
}
